                    addPointSphere(D, "D", 0x38bdf8, 0.09, new THREE.Vector3(0.26, -0.05, 0));
                    addPointSphere(E, "E", 0xfbbf24, 0.085, new THREE.Vector3(0.22, 0.18, -0.1));
                    addPointSphere(F, "F", 0xfbbf24, 0.085, new THREE.Vector3(-0.22, 0.18, -0.1));
                    break;
                }
            }

            updateRealTimeOcclusion(true);
        }

        // ============================================================================
        // 5. INTERACTIVE QUIZ LOGIC (WITH REVERSIBLE SELECTION & EXPLANATIONS)
        // ============================================================================
        function getQuestionState(model) {
            if (!userQuizStates[model.id]) {
                userQuizStates[model.id] = {
                    answered: false,
                    isCorrect: false,
                    selectedOption: null, // 'A' | 'B' | 'C' | 'D'
                    tfChoices: [null, null, null, null], // true | false | null
                    shortInput: ''
                };
            }
            return userQuizStates[model.id];
        }

        function resetCurrentQuestionState() {
            const model = MODELS_DATA[currentModelIndex];
            if (!model) return;
            delete userQuizStates[model.id];
            renderQuestionInteractiveUI(model);
            renderSidebarList();
        }

        function selectModel(index, updateUrlHash = true) {
            if (index < 0) index = MODELS_DATA.length - 1;
            if (index >= MODELS_DATA.length) index = 0;
            currentModelIndex = index;

            const model = MODELS_DATA[currentModelIndex];

            if (updateUrlHash) {
                try {
                    history.replaceState(null, '', `#${model.urlHash}`);
                } catch (e) {}
            }

            buildModelScene(model);
            resetCameraView();

            document.getElementById('panel-label-badge').textContent = model.label;
            document.getElementById('panel-title').textContent = model.shortTitle;
            document.getElementById('floating-pill-badge').textContent = model.label;
            document.getElementById('floating-pill-title').textContent = model.shortTitle;
            renderMathInNode(document.getElementById('panel-question-text'), model.question);

            const partTypeEl = document.getElementById('panel-part-type');
            if (model.part === 1) partTypeEl.textContent = 'Phần I • Trắc nghiệm';
            else if (model.part === 2) partTypeEl.textContent = 'Phần II • Đúng / Sai';
            else partTypeEl.textContent = 'Phần III • Trả lời ngắn';

            renderQuestionInteractiveUI(model);
            renderSidebarList();

            // On mobile or tablet when left list is opened temporarily, auto-close it after picking a question
            if (window.innerWidth < 1100 && leftPanelOpen) {
                leftPanelOpen = false;
                applyWorkspaceLayout();
            }
        }

        function renderQuestionInteractiveUI(model) {
            const container = document.getElementById('panel-options-container');
            const banner = document.getElementById('quiz-result-banner');
            const expCard = document.getElementById('explanation-card');
            const ansBadge = document.getElementById('panel-answer-badge');
            const expText = document.getElementById('panel-explanation');
            const resetBtn = document.getElementById('btn-reset-question');

            container.innerHTML = '';
            const state = getQuestionState(model);

            const hasAnySelection =
                state.answered ||
                state.selectedOption !== null ||
                state.tfChoices.some(v => v !== null) ||
                (state.shortInput && state.shortInput.trim() !== '');

            if (hasAnySelection) {
                resetBtn.classList.remove('hidden');
                resetBtn.classList.add('inline-flex');
            } else {
                resetBtn.classList.add('hidden');
                resetBtn.classList.remove('inline-flex');
            }

            // 1. PHẦN I: TRẮC NGHIỆM 4 LỰA CHỌN (Click to answer, click again to unselect!)
            if (model.part === 1 && model.options) {
                const letters = ["A", "B", "C", "D"];
                model.options.forEach((optText, idx) => {
                    const letter = letters[idx];
                    const isSelected = state.selectedOption === letter;
                    const isRightAnswer = model.answer === letter;

                    let btnClass = 'bg-slate-900/90 hover:bg-slate-800/90 border-slate-800 hover:border-sky-500/50 text-slate-200';
                    let letterBadge = `<span class="w-6 h-6 rounded-lg bg-slate-800 text-sky-300 font-extrabold flex items-center justify-center text-xs shrink-0">${letter}</span>`;
                    let statusTag = '';

                    if (state.answered) {
                        if (isRightAnswer) {
                            btnClass = 'bg-emerald-500/20 border-emerald-500 text-emerald-100 font-bold shadow-sm';
                            letterBadge = `<span class="w-6 h-6 rounded-lg bg-emerald-500 text-slate-950 font-extrabold flex items-center justify-center text-xs shrink-0">${letter}</span>`;
                            statusTag = `<span class="px-2 py-0.5 rounded bg-emerald-500 text-slate-950 text-[10px] font-extrabold shrink-0">ĐÚNG</span>`;
                        } else if (isSelected && !isRightAnswer) {
                            btnClass = 'bg-rose-500/20 border-rose-500 text-rose-100 font-bold shadow-sm';
                            letterBadge = `<span class="w-6 h-6 rounded-lg bg-rose-500 text-white font-extrabold flex items-center justify-center text-xs shrink-0">${letter}</span>`;
                            statusTag = `<span class="px-2 py-0.5 rounded bg-rose-500 text-white text-[10px] font-extrabold shrink-0">SAI</span>`;
                        } else {
                            btnClass = 'bg-slate-900/40 border-slate-800/60 text-slate-500';
                        }
                    }

                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = `w-full text-left px-3 py-2.5 rounded-xl border text-xs transition flex items-center justify-between gap-2.5 ${btnClass}`;
                    btn.title = isSelected ? "Nhấn lần nữa để hủy chọn và quay về trạng thái ban đầu" : "Nhấn để chọn đáp án";
                    btn.onclick = () => {
                        // Clicking the already-selected option reverts back to pre-selection state!
                        if (state.answered && state.selectedOption === letter) {
                            resetCurrentQuestionState();
                            return;
                        }
                        state.selectedOption = letter;
                        state.answered = true;
                        state.isCorrect = (letter === model.answer);
                        renderQuestionInteractiveUI(model);
                        renderSidebarList();
                    };

                    const cleanOptText = String(optText).replace(/^[A-D]\.\s*/i, '');
                    btn.innerHTML = `
                        <div class="flex items-center gap-2.5 min-w-0">
                            ${letterBadge}
                            <span class="opt-text leading-relaxed"></span>
                        </div>
                        ${statusTag}
                    `;
                    renderMathInNode(btn.querySelector('.opt-text'), cleanOptText);
                    container.appendChild(btn);
                });
            }

            // 2. PHẦN II: ĐÚNG / SAI (4 Ý a, b, c, d)
            else if (model.part === 2 && model.statements) {
                model.statements.forEach((st, idx) => {
                    const userChoice = state.tfChoices[idx]; // true | false | null
                    const actual = !!st.isTrue;

                    let cardStyle = 'bg-slate-900/90 border-slate-800';
                    let itemResultHtml = '';

                    if (state.answered) {
                        const isItemRight = (userChoice === actual);
                        cardStyle = isItemRight
                            ? 'bg-emerald-500/10 border-emerald-500/50'
                            : 'bg-rose-500/10 border-rose-500/50';
                        itemResultHtml = isItemRight
                            ? `<span class="text-[11px] font-bold text-emerald-400">✓ Chính xác (${actual ? 'Đúng' : 'Sai'})</span>`
                            : `<span class="text-[11px] font-bold text-rose-400">✗ Sai (Đáp án: ${actual ? 'Đúng' : 'Sai'})</span>`;
                    }

                    const trueBtnStyle = userChoice === true
                        ? 'bg-emerald-500 text-slate-950 font-extrabold border-emerald-400 shadow'
                        : 'bg-slate-950 text-slate-300 border-slate-700 hover:border-emerald-500/50';
                    const falseBtnStyle = userChoice === false
                        ? 'bg-rose-500 text-white font-extrabold border-rose-400 shadow'
                        : 'bg-slate-950 text-slate-300 border-slate-700 hover:border-rose-500/50';

                    const row = document.createElement('div');
                    row.className = `p-3 rounded-xl border transition space-y-2 ${cardStyle}`;
                    row.innerHTML = `
                        <div class="text-xs text-slate-100 leading-relaxed st-text"></div>
                        <div class="flex items-center justify-between gap-2 pt-0.5">
                            <div class="flex items-center gap-1.5">
                                <button type="button" class="btn-tf-true px-3 py-1 rounded-lg border text-xs transition ${trueBtnStyle}">
                                    Đúng
                                </button>
                                <button type="button" class="btn-tf-false px-3 py-1 rounded-lg border text-xs transition ${falseBtnStyle}">
                                    Sai
                                </button>
                            </div>
                            ${itemResultHtml}
                        </div>
                    `;
                    renderMathInNode(row.querySelector('.st-text'), st.text);

                    // Toggleable Đúng/Sai buttons (clicking active choice unselects it)
                    row.querySelector('.btn-tf-true').onclick = () => {
                        state.tfChoices[idx] = (state.tfChoices[idx] === true) ? null : true;
                        state.answered = false;
                        renderQuestionInteractiveUI(model);
                        renderSidebarList();
                    };
                    row.querySelector('.btn-tf-false').onclick = () => {
                        state.tfChoices[idx] = (state.tfChoices[idx] === false) ? null : false;
                        state.answered = false;
                        renderQuestionInteractiveUI(model);
                        renderSidebarList();
                    };

                    container.appendChild(row);
                });

                const actionRow = document.createElement('div');
                actionRow.className = 'flex items-center gap-2 pt-1';

                const checkBtn = document.createElement('button');
                checkBtn.type = 'button';
                checkBtn.className = 'flex-1 py-2.5 px-4 rounded-xl bg-sky-500 hover:bg-sky-400 text-white font-extrabold text-xs transition shadow';
                checkBtn.textContent = 'Kiểm tra đáp án';
                checkBtn.onclick = () => {
                    state.answered = true;
                    state.isCorrect = model.statements.every((st, i) => state.tfChoices[i] === !!st.isTrue);
                    renderQuestionInteractiveUI(model);
                    renderSidebarList();
                };
                actionRow.appendChild(checkBtn);

                if (state.answered || state.tfChoices.some(v => v !== null)) {
                    const undoBtn = document.createElement('button');
                    undoBtn.type = 'button';
                    undoBtn.className = 'py-2.5 px-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs border border-slate-700 transition';
                    undoBtn.textContent = 'Làm lại';
                    undoBtn.onclick = () => resetCurrentQuestionState();
                    actionRow.appendChild(undoBtn);
                }

                container.appendChild(actionRow);
            }

            // 3. PHẦN III: TRẢ LỜI NGẮN (Input + Check + Reset)
            else if (model.part === 3) {
                const box = document.createElement('div');
                box.className = 'space-y-2.5 pt-1';

                const input = document.createElement('input');
                input.type = 'text';
                input.value = state.shortInput || '';
                input.placeholder = 'Nhập đáp số nguyên (VD: 4, 10, 18)...';
                input.className = 'w-full bg-slate-900 border border-slate-700 focus:border-sky-500 rounded-xl px-3.5 py-2.5 text-xs font-bold text-white placeholder-slate-500 focus:outline-none';
                input.oninput = (e) => {
                    state.shortInput = e.target.value;
                    if (state.answered) {
                        state.answered = false;
                        renderQuestionInteractiveUI(model);
                        renderSidebarList();
                    }
                };
                input.onkeydown = (e) => {
                    if (e.key === 'Enter') {
                        const userVal = String(state.shortInput || '').trim();
                        state.answered = true;
                        state.isCorrect = (userVal !== '' && userVal === String(model.shortAnswer).trim());
                        renderQuestionInteractiveUI(model);
                        renderSidebarList();
                    }
                };

                const btnRow = document.createElement('div');
                btnRow.className = 'flex items-center gap-2';

                const checkBtn = document.createElement('button');
                checkBtn.type = 'button';
                checkBtn.className = 'flex-1 py-2.5 px-4 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs transition shadow';
                checkBtn.textContent = 'Kiểm tra đáp án';
                checkBtn.onclick = () => {
                    const userVal = String(state.shortInput || '').trim();
                    state.answered = true;
                    state.isCorrect = (userVal !== '' && userVal === String(model.shortAnswer).trim());
                    renderQuestionInteractiveUI(model);
                    renderSidebarList();
                };
                btnRow.appendChild(checkBtn);

                if (state.answered || (state.shortInput && state.shortInput.trim() !== '')) {
                    const undoBtn = document.createElement('button');
                    undoBtn.type = 'button';
                    undoBtn.className = 'py-2.5 px-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs border border-slate-700 transition';
                    undoBtn.textContent = 'Làm lại';
                    undoBtn.onclick = () => resetCurrentQuestionState();
                    btnRow.appendChild(undoBtn);
                }

                box.appendChild(input);
                box.appendChild(btnRow);
                container.appendChild(box);
            }

            // Show Result Banner & Detailed Explanation when answered
            if (state.answered) {
                banner.classList.remove('hidden');
                if (state.isCorrect) {
                    banner.className = 'rounded-2xl p-3.5 border bg-emerald-500/15 border-emerald-500/40 text-emerald-300 text-xs font-bold flex items-center justify-between gap-2';
                    banner.innerHTML = `
                        <span>✓ Chính xác! Bạn đã trả lời ĐÚNG.</span>
                        <button onclick="resetCurrentQuestionState()" class="px-2.5 py-1 rounded-lg bg-slate-900/90 hover:bg-slate-800 text-slate-200 text-[11px] font-semibold border border-slate-700 shrink-0">
                            Chọn lại
                        </button>
                    `;
                } else {
                    banner.className = 'rounded-2xl p-3.5 border bg-rose-500/15 border-rose-500/40 text-rose-300 text-xs font-bold flex items-center justify-between gap-2';
                    banner.innerHTML = `
                        <span>✗ Chưa chính xác! Hãy xem giải thích chi tiết bên dưới.</span>
                        <button onclick="resetCurrentQuestionState()" class="px-2.5 py-1 rounded-lg bg-slate-900/90 hover:bg-slate-800 text-slate-200 text-[11px] font-semibold border border-slate-700 shrink-0">
                            Chọn lại
                        </button>
                    `;
                }

                expCard.classList.remove('hidden');
                ansBadge.textContent = `Đáp án: ${model.answer}`;
                renderMathInNode(expText, model.explanation);
            } else {
                banner.classList.add('hidden');
                expCard.classList.add('hidden');
            }
        }

        function stepModel(delta) {
            selectModel(currentModelIndex + delta, true);
        }

        function filterByPart(part) {
            currentPartFilter = part;
            document.querySelectorAll('.part-tab').forEach(btn => {
                btn.className = 'part-tab py-1.5 rounded-lg text-[11px] font-bold text-slate-400 hover:text-white transition';
            });
            const activeBtn = document.getElementById(`filter-${part}`);
            if (activeBtn) {
                activeBtn.className = 'part-tab py-1.5 rounded-lg text-[11px] font-bold bg-sky-500 text-white shadow transition';
            }
            renderSidebarList();
        }

        function renderSidebarList() {
            const listEl = document.getElementById('model-list');
            const query = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
            listEl.innerHTML = '';

            MODELS_DATA.forEach((m, index) => {
                if (currentPartFilter !== 'all' && m.part !== currentPartFilter) return;
                if (query) {
                    const haystack = `${m.label} ${m.shortTitle} ${m.question} ${m.urlHash}`.toLowerCase();
                    if (!haystack.includes(query)) return;
                }

                const isActive = index === currentModelIndex;
                const qState = userQuizStates[m.id];

                let rightBadgeHtml = `<span class="text-[10px] font-mono text-emerald-400 bg-slate-900 px-1.5 py-0.5 rounded border border-slate-800">#${m.urlHash}</span>`;
                if (qState && qState.answered) {
                    rightBadgeHtml = qState.isCorrect
                        ? `<span class="text-[10px] font-extrabold text-emerald-300 bg-emerald-500/20 px-1.5 py-0.5 rounded border border-emerald-500/40">✓ Đúng</span>`
                        : `<span class="text-[10px] font-extrabold text-rose-300 bg-rose-500/20 px-1.5 py-0.5 rounded border border-rose-500/40">✗ Sai</span>`;
                }

                const item = document.createElement('button');
                item.onclick = () => selectModel(index, true);
                item.className = `w-full text-left p-2.5 rounded-xl border transition-all flex items-start gap-2.5 ${
                    isActive
                        ? 'bg-sky-500/15 border-sky-500/60 shadow-lg shadow-sky-500/5'
                        : 'bg-slate-950/60 border-slate-800/80 hover:bg-slate-800/60 hover:border-slate-700'
                }`;

                const partBadgeColor =
                    m.part === 1 ? 'bg-sky-500/20 text-sky-300 border-sky-500/30' :
                    m.part === 2 ? 'bg-amber-500/20 text-amber-300 border-amber-500/30' :
                                   'bg-emerald-500/20 text-emerald-300 border-emerald-500/30';

                item.innerHTML = `
                    <div class="w-7 h-7 rounded-lg ${partBadgeColor} border flex items-center justify-center text-xs font-extrabold shrink-0 mt-0.5">
                        ${m.qNum}
                    </div>
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center justify-between gap-1">
                            <span class="text-xs font-extrabold ${isActive ? 'text-sky-300' : 'text-slate-100'}">${m.label}</span>
                            ${rightBadgeHtml}
                        </div>
                        <p class="text-[11px] text-slate-400 truncate mt-0.5">${m.shortTitle}</p>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        // Camera & Scene Quick Actions
        function resetCameraView() {
            if (!camera || !controls) return;
            const model = MODELS_DATA[currentModelIndex];
            if (model && model.defaultCam) {
                camera.position.set(model.defaultCam[0], model.defaultCam[1], model.defaultCam[2]);
            } else {
                camera.position.set(0.35, 2.75, 7.35);
            }
            controls.target.set(0, 0.25, 0);
            controls.update();
            syncCanvasAspectRatio();
            updateRealTimeOcclusion(true);
        }

        function flipCameraBackView() {
            if (!camera || !controls) return;
            const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
            camera.position.set(
                controls.target.x - offset.x,
                camera.position.y,
                controls.target.z - offset.z
            );
            controls.update();
            updateRealTimeOcclusion(true);
        }

        function lookFromBottomView() {
            if (!camera || !controls) return;
            camera.position.set(0.25, -5.8, 3.6);
            controls.target.set(0, 0.1, 0);
            controls.update();
            updateRealTimeOcclusion(true);
        }

        function toggleAutoRotate() {
            autoRotate = !autoRotate;
            const btn = document.getElementById('btn-autorotate');
            if (autoRotate) {
                btn.className = 'px-2.5 py-1.5 rounded-xl bg-emerald-500/20 border border-emerald-500/50 text-xs font-bold text-emerald-300 flex items-center gap-1 shrink-0 transition';
            } else {
                btn.className = 'px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 flex items-center gap-1 shrink-0 transition';
            }
        }

        function togglePlanesVisibility() {
            showPlanes = !showPlanes;
            activePlaneMeshes.forEach(m => { m.visible = showPlanes; });
            const btn = document.getElementById('btn-toggle-planes');
            btn.className = showPlanes
                ? 'px-2.5 py-1.5 rounded-xl bg-sky-500/20 border border-sky-500/40 text-xs font-medium text-sky-300 flex items-center gap-1 shrink-0 transition'
                : 'px-2.5 py-1.5 rounded-xl bg-slate-800 text-xs font-medium text-slate-400 flex items-center gap-1 shrink-0 transition';
            updateRealTimeOcclusion(true);
        }

        function toggleLabelsVisibility() {
            showLabels = !showLabels;
            const btn = document.getElementById('btn-toggle-labels');
            btn.className = showLabels
                ? 'px-2.5 py-1.5 rounded-xl bg-sky-500/20 border border-sky-500/40 text-xs font-medium text-sky-300 flex items-center gap-1 shrink-0 transition'
                : 'px-2.5 py-1.5 rounded-xl bg-slate-800 text-xs font-medium text-slate-400 flex items-center gap-1 shrink-0 transition';
        }

        function toggleGridHelper() {
            showGrid = !showGrid;
            if (gridHelper) gridHelper.visible = showGrid;
            const btn = document.getElementById('btn-toggle-grid');
            btn.className = showGrid
                ? 'px-2.5 py-1.5 rounded-xl bg-sky-500/20 border border-sky-500/40 text-xs font-medium text-sky-300 flex items-center gap-1 shrink-0 transition'
                : 'px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 flex items-center gap-1 shrink-0 transition';
        }

        // ============================================================================
        // 6. COLLAPSIBLE WORKSPACE PANELS, ZEN 3D MODE & FULLSCREEN API
        // ============================================================================
        function applyWorkspaceLayout() {
            const sb = document.getElementById('sidebar-panel');
            const insp = document.getElementById('inspector-panel');
            const backdrop = document.getElementById('mobile-backdrop');
            const btnHeaderLeft = document.getElementById('btn-header-left');
            const btnHeaderRight = document.getElementById('btn-header-right');
            const btnHeaderZen = document.getElementById('btn-header-zen');
            const edgeIconLeft = document.getElementById('edge-icon-left');
            const edgeIconRight = document.getElementById('edge-icon-right');
            const pillOpenQuizBtn = document.getElementById('floating-pill-open-quiz');

            const isMobile = window.innerWidth < 768;

            // Left Panel state
            if (isMobile) {
                sb.classList.remove('panel-collapsed-left');
                if (leftPanelOpen) sb.classList.remove('-translate-x-full');
                else sb.classList.add('-translate-x-full');
            } else {
                sb.classList.remove('-translate-x-full');
                if (leftPanelOpen) sb.classList.remove('panel-collapsed-left');
                else sb.classList.add('panel-collapsed-left');
            }

            // Right Panel state
            if (isMobile) {
                insp.classList.remove('panel-collapsed-right');
                if (rightPanelOpen) insp.classList.remove('translate-x-full');
                else insp.classList.add('translate-x-full');
            } else {
                insp.classList.remove('translate-x-full');
                if (rightPanelOpen) insp.classList.remove('panel-collapsed-right');
                else insp.classList.add('panel-collapsed-right');
            }

            // Mobile backdrop
            if (backdrop) {
                if (isMobile && (leftPanelOpen || rightPanelOpen)) {
                    backdrop.classList.remove('hidden');
                } else {
                    backdrop.classList.add('hidden');
                }
            }

            // Header button active states
            const activeTabClass = 'px-2.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 bg-sky-500/20 text-sky-300 border border-sky-500/30';
            const inactiveTabClass = 'px-2.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 text-slate-400 hover:text-white hover:bg-slate-800/80 border border-transparent';

            if (btnHeaderLeft) btnHeaderLeft.className = leftPanelOpen ? activeTabClass : inactiveTabClass;
            if (btnHeaderRight) btnHeaderRight.className = rightPanelOpen ? activeTabClass : inactiveTabClass;

            const isZen = !leftPanelOpen && !rightPanelOpen;
            if (btnHeaderZen) {
                btnHeaderZen.className = isZen
                    ? 'px-2.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-emerald-500/20 text-emerald-300 border border-emerald-500/40'
                    : inactiveTabClass;
            }

            // Edge handle arrow directions
            if (edgeIconLeft) {
                edgeIconLeft.style.transform = leftPanelOpen ? 'rotate(0deg)' : 'rotate(180deg)';
            }
            if (edgeIconRight) {
                edgeIconRight.style.transform = rightPanelOpen ? 'rotate(0deg)' : 'rotate(180deg)';
            }

            // Show quick "Làm bài" button on floating top pill whenever right quiz panel is collapsed
            if (pillOpenQuizBtn) {
                if (!rightPanelOpen) pillOpenQuizBtn.classList.remove('hidden');
                else pillOpenQuizBtn.classList.add('hidden');
            }

            // Smoothly re-sync 3D canvas aspect during and after CSS transition
            syncCanvasAspectRatio();
            setTimeout(syncCanvasAspectRatio, 160);
            setTimeout(syncCanvasAspectRatio, 340);
        }

        function toggleLeftPanel(forceState) {
            const nextState = typeof forceState === 'boolean' ? forceState : !leftPanelOpen;
            leftPanelOpen = nextState;
            // On mobile (< 768px) or narrow tablet portrait (< 900px), prevent both drawers overlapping
            if (leftPanelOpen && window.innerWidth < 900) {
                rightPanelOpen = false;
            }
            applyWorkspaceLayout();
        }

        function toggleRightPanel(forceState) {
            const nextState = typeof forceState === 'boolean' ? forceState : !rightPanelOpen;
            rightPanelOpen = nextState;
            if (rightPanelOpen && window.innerWidth < 900) {
                leftPanelOpen = false;
            }
            applyWorkspaceLayout();
        }

        function toggleZen3DMode() {
            const isCurrentlyZen = !leftPanelOpen && !rightPanelOpen;
            if (!isCurrentlyZen) {
                savedStateBeforeZen = { left: leftPanelOpen, right: rightPanelOpen };
                leftPanelOpen = false;
                rightPanelOpen = false;
            } else {
                if (savedStateBeforeZen && (savedStateBeforeZen.left || savedStateBeforeZen.right)) {
                    leftPanelOpen = savedStateBeforeZen.left;
                    rightPanelOpen = savedStateBeforeZen.right;
                } else {
                    leftPanelOpen = window.innerWidth >= 1100;
                    rightPanelOpen = true;
                }
            }
            applyWorkspaceLayout();
        }

        function closeMobilePanels() {
            leftPanelOpen = false;
            rightPanelOpen = false;
            applyWorkspaceLayout();
        }

        function toggleNativeFullscreen() {
            const docEl = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (docEl.requestFullscreen) docEl.requestFullscreen().catch(() => {});
                else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const isFs = !!document.fullscreenElement;
            const enterIcon = document.getElementById('icon-fs-enter');
            const exitIcon = document.getElementById('icon-fs-exit');
            if (enterIcon && exitIcon) {
                enterIcon.classList.toggle('hidden', isFs);
                exitIcon.classList.toggle('hidden', !isFs);
            }
            setTimeout(syncCanvasAspectRatio, 100);
        });

        window.onload = function () {
            ensureSingleCleanRoot();
            initResponsivePanelDefaults();
            initThreeJS();
            const initialIdx = resolveModelIndexFromUrl();
            if (initialIdx !== -1) {
                selectModel(initialIdx, false);
            } else {
                selectModel(0, true);
            }
        };
    </script>
</body>
</html>
